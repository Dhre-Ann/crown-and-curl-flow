# Deploys the Vite app as static files. Use this instead of Jekyll + /docs.
# Repo → Settings → Pages → Build and deployment → Source: GitHub Actions
name: Deploy GitHub Pages

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # So the same secret works whether it is stored under Repository secrets or the github-pages Environment.
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Writes public/api-runtime-config.js so the live site always gets the API URL even if the Vite env embed failed.
      - name: Inject API URL for static hosting
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const u = (process.env.VITE_API_BASE_URL || "").trim().replace(/\/$/, "");
          const lines = [
            "/** Auto-generated in GitHub Actions — do not commit secrets here. */",
            u
              ? `window.__CROWN_STUDIO_API_BASE__ = ${JSON.stringify(u)};`
              : `window.__CROWN_STUDIO_API_BASE__ = "";`,
            "",
          ];
          fs.mkdirSync("public", { recursive: true });
          fs.writeFileSync("public/api-runtime-config.js", lines.join("\n"), "utf8");
          if (!u) {
            console.log("::warning::VITE_API_BASE_URL is empty — Browse shops / API calls will fail on Pages until you add the repository or github-pages environment secret.");
          }
          NODE
      - name: Check VITE_API_BASE_URL secret
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::warning::VITE_API_BASE_URL is not set. Add it under Settings → Secrets → Actions (repository) OR under the github-pages environment. Set CORS_ORIGINS on Render to your Pages origin (e.g. https://YOUR_USER.github.io)."
          fi
      - name: Build static site
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          npx vite build --base /${{ github.event.repository.name }}/
          node -e "require('fs').copyFileSync('dist/index.html','dist/404.html')"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
